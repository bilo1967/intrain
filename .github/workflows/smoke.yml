name: InTrain 1.0 smoke tests

on:
  push:
    branches:
      - '1.0'
  pull_request:
    branches:
      - '1.0'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application JavaScript syntax
        shell: bash
        run: |
          for script in js/*.js; do
            case "$script" in
              *.min.js) continue ;;
            esac
            node --check "$script"
          done
      - name: Previously existing tests
        run: node --test --test-name-pattern='^(?!(video URL validation|supervisor state snapshot|interpreter cannot|supervisor validates)).*' tests/smoke.test.js
      - name: URL validator test
        if: always()
        run: node --test --test-name-pattern='^video URL validation' tests/smoke.test.js
      - name: Supervisor snapshot test
        if: always()
        run: node --test --test-name-pattern='^supervisor state snapshot' tests/smoke.test.js
      - name: Interpreter read-only test
        if: always()
        run: node --test --test-name-pattern='^interpreter cannot' tests/smoke.test.js
      - name: Supervisor video load test
        if: always()
        run: node --test --test-name-pattern='^supervisor validates' tests/smoke.test.js
      - name: Run regression tests
        if: always()
        run: node --test tests/smoke.test.js
