name: InTrain 1.0 smoke tests

on:
  push:
    branches:
      - '1.0'
  pull_request:
    branches:
      - '1.0'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application JavaScript syntax
        shell: bash
        run: |
          for script in js/*.js; do
            case "$script" in
              *.min.js) continue ;;
            esac
            node --check "$script"
          done
      - name: Prior regression tests
        run: node --test --test-name-pattern='^(?!(session mode shows|supervisor video player|URL panel collapses|interpreter synchronizes seeks)).*' tests/smoke.test.js
      - name: Session mode icon test
        if: always()
        run: node --test --test-name-pattern='^session mode shows' tests/smoke.test.js
      - name: Video overlay test
        if: always()
        run: node --test --test-name-pattern='^supervisor video player' tests/smoke.test.js
      - name: URL collapse test
        if: always()
        run: node --test --test-name-pattern='^URL panel collapses' tests/smoke.test.js
      - name: Seek API test
        if: always()
        run: node --test --test-name-pattern='^interpreter synchronizes seeks' tests/smoke.test.js
      - name: Run regression tests
        if: always()
        run: node --test tests/smoke.test.js
