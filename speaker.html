<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-type" content="text/html; charset=utf-8" />

  <!-- responsive layout -->
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta name="description" content="Web based interpreter training tool">
  <meta name="keywords" content="interpreter,interpreting,training,remote,web based,webrtc">

  <!-- favicon for all devices -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/icons/favicon-16x16.png">
  <link rel="manifest" href="/images/icons/site.webmanifest">
  <link rel="mask-icon" href="/images/icons/safari-pinned-tab.svg" color="#5bbad5">
  <link rel="shortcut icon" href="/images/icons/favicon.ico">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="msapplication-config" content="/images/icons/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">

  <title>intrain:speaker</title>

  <!-- FontAwesome icons -->
  <script src="https://kit.fontawesome.com/ea65ac0a48.js"></script>

  <!-- Material Icons / Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <style>
  .material-font {
    font-family: 'Material Symbols Outlined';
    font-style: normal;
    font-weight: 200;
    font-size: 26px; /* default font size */
  }
  </style>


  <!-- Bootstrap 5: css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

  <!-- InTrain: css -->
  <link rel="stylesheet" href="css/intrain-responsive.css?v=1.0.4">

  <!-- JQuery, JQueryUI, Migrate: js -->
  <script
  src="https://code.jquery.com/jquery-3.4.1.min.js"
  integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo="
  crossorigin="anonymous"></script>
  <script
  src="https://code.jquery.com/ui/1.12.0/jquery-ui.min.js"
  integrity="sha256-eGE6blurk5sHj+rmkfsGYeKyZx3M4bG+ZlFyA7Kns7E="
  crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-migrate-3.0.0.min.js"></script>



  <!-- Bootstrap 5 JavaScript (with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  <script src="js/bootstrap-ui.js"></script>



  <!-- Javascript locale -->
  <script src="js/jquery.swapelements.js"></script>
  <script src="js/peerjs.min.js"></script>


  <script src="js/utils.js?0.01"></script>
  <script src="js/common.js?0.02"></script>
  <script src="js/peercommon.js?v=1.0.1"></script>
  <script src="config/config.js"></script>
  <script src="js/intrain.js?v=1.0.1"></script>
  <script src="js/log.js?0.01"></script>
  <script src="js/io-devices.js?0.01"></script>


  <!-- https://github.com/daneden/animate.css -->
  <link rel="stylesheet" href="css/animate.min.css">
  <script src="js/animatecss.js"></script>


<script src="js/storage.js"></script>
<script src="js/role-speaker.js"></script>

</head>

<body class="background-speaker">

<div id="logo"><img src="./images/logo_uniBO_white_UpperLeft.png" /></div>

<!-- Header: begin -->
<div class="undroppable unselectable container clearfix bg-light border rounded mt-2 mb-2 p-2 opacity-75 opacity-hover-100 app-width" id="top-panel">
  <div class="float-start" id="login-info">You're not logged in</div>
  <div class="float-end">
    <div class="btn btn-sm btn-success">
      <i id="config-button" class="fas fa-cog" aria-hidden="true" data-bs-toggle="modal" data-bs-target="#config-panel"></i>
    </div>

    <div class="btn btn-sm btn-danger">
      <i id="logout-button" class="fas fa-power-off" aria-hidden="true"></i>
    </div>
  </div>
</div>
<!-- Header: end -->



<!-- Main panel: begin -->
<div class="undroppable unselectable container bg-light border rounded pb-1 app-width" id="main-panel">

  <div class="d-flex w-100 justify-content-between align-items-center p-1" style="height: 4rem">
    <div class="display-5 ms-1 role-description">intrain:speaker</div>
    <div class="d-flex me-auto ms-auto p-2 text-danger bg-white  border rounded-1 border-danger   hidden align-items-center" id="session-mode"></div>
    <div class="me-1 hide-on-narrow-devices"><div class="clock"><span id="date" class="hide-on-narrow-devices"></span><span class="hide-on-narrow-devices"> - </span><span id="hours"></span>:<span id="minutes"></span>:<span id="seconds"></span></div></div>
  </div>


  <!-- external frame: begin -->
  <div class="flex-column">

    <!-- video and chat blocks: begin -->
    <div class="d-flex justify-content-start flex-wrap">


      <!-- left column (videos): begin -->
      <div class="d-inline-flex flex-wrap justify-content-center p-1 mb-1 align-items-stretch border rounded" id="left-column">

        <!-- stacked mini videos: begin -->
        <div class="flex-column  p-0 mr-minivideo first" >

          <!-- stacked mini video 1 -->
          <div class="video-container mini-video-height" id="video1">
            <video id="interpreterVideo" class="rounded mini-video" data-source="" data-video-url="" autoplay playsinline poster="images/buono.jpg"   muted></video>
            <div id="interpreter-video-caption" class="video-caption video-position-bc">[ interpreter ]</div>
            <div class="video-button video-position-bl" >
              <div data-bs-toggle="tooltip" title="Send a file to the interpreter">
                <input type="file" name="file" id="send-file-to-interpreter" class="input-file" />
                <label for="send-file-to-interpreter" class="p-0 m-0" data-bs-toggle="tooltip" title="Send a file to the interpreter"><i class="fas fa-file-upload fa-lg"></i></label>
              </div>
            </div>
            <div class="video-button video-position-br" id="interpreter-fullscreen">
                <i class="fas fa-expand-arrows-alt fa-lg" data-bs-toggle="tooltip" title="full screen"></i>
            </div>
            <div class="video-button video-position-tl" id="interpreter-audio-toggle">
                <i class="fas fa-volume-up fa-lg" data-bs-toggle="tooltip" title="mute/un&shy;mute the in&shy;ter&shy;preter's au&shy;dio"></i>
            </div>
          </div>

          <!-- stacked mini video 2 (you) -->
          <div class="mt-2 flex-column" id="video2">

            <div class="video-container mini-video-height">
              <video id="localVideo" class="rounded mini-video mirrored"
                     data-source="" data-video-url="" autoplay playsinline
                     poster="images/buono.jpg" muted></video>
              <div class="video-caption video-position-bc">[ you ]</div>
              <div class="video-button video-position-tr">
                <i id="toggle-camera" class="fas fa-lg fa-video"  data-bs-toggle="tooltip" title="Turn on/off your webcam"></i>
              </div>
            </div>

            <div class="d-inline-flex w-100 mt-1">
              <canvas class="d-inline-flex border rounded" id="vumeter"></canvas>
              &nbsp;
              <button id="toggle-microphone" class="btn btn-sm btn-danger w-3em">
                <i class="fas fa-microphone" aria-hidden="true" data-bs-toggle="tooltip" title="Turn on/off your microphone"></i>
              </button>
            </div>

          </div>

        </div>
        <!-- stacked mini videos: end -->

        <!-- main video: begin -->
        <div class="normal-video-width position-relative second ">
          <div class="video-button video-position-tr">
            <i class="fas fa-exchange-alt fa-lg" id="swap-button"></i>
          </div>

          <!-- video player -->
          <div class="player-container stack-bottom hidden p-0 m-0" id="player-container">
            <video id="myplayer" height="100%" class="border rounded normal-video-width normal-video-height" control="controls" src="" preload="none"></video>
          </div>

          <div class="video-container normal-video-height" id="video3">
            <video class="normal-video border rounded" data-source="" data-video-url="" autoplay playsinline poster="images/cattivo.jpg" id="supervisorVideo" muted></video>
            <div id="supervisor-video-caption" class="video-caption video-position-bc">[ supervisor ]</div>
            <div class="video-button video-position-bl">
              <div data-bs-toggle="tooltip" title="Send a file to the supervisor">
                <input type="file" name="file" id="send-file-to-supervisor" class="input-file" />
                <label for="send-file-to-supervisor" class="p-0 m-0"><i class="fas fa-file-upload fa-lg"></i></label>
              </div>
            </div>
            <div class="video-button video-position-tl" id="supervisor-audio-toggle">
                <i class="fas fa-volume-up fa-lg" data-bs-toggle="tooltip" title="mute/un&shy;mute the su&shy;per&shy;vi&shy;sor's au&shy;dio"></i>
            </div>
            <div class="video-button video-position-br" id="supervisor-fullscreen">
                <i class="fas fa-expand-arrows-alt fa-lg" data-bs-toggle="tooltip" title="full screen"></i>
            </div>
            <div class="video-label video-position-center text-clear" id="recording-icon"></div>

          </div>

          <!-- audio controls: begin -->
          <div class="audio-controls d-flex justify-content-center align-items-start  fixed-flex mt-1" style="height: var(--normal-button-height)">
              <div id ='recording-indicator' class="text-danger"></div>
          </div>
          <!-- audio controls: end -->

        </div>
        <!-- main video: end -->

      </div>
      <!-- left column (videos): end -->


      <!-- right column (chat): begin -->
      <div id="chatpanel" class="d-inline-flex mt-1 ms-1 me-0 mb-1 flex-column flex-grow-100">
        <div id="chatboard" class="selectable-text align-self-stretch bg-chat text-light border rounded p-1 mb-1 h-100"></div>
        <input id="chattext" class="bg-chat align-self-stretch border rounded mt-auto p-1 w-100">
      </div>
      <!-- right column (chat): end -->


    </div>
    <!-- video and chat blocks: end -->


    <!-- toolbar: begin -->
    <div class="d-flex justify-content-start flex-wrap border rounded mb-1 p-1 justify-content-start">

        <!-- send file to all: begin -->
        <div class="btn btn-sm btn-success btn-w-2">
          <label for="send-file-to-all" class="p-0 m-0">
            <i style="padding-top: 2px" class="fas fs-large fa-file-upload" title="Send a file to everyone" data-bs-toggle="tooltip"></i>
          </label>
          <input type="file" name="file" id="send-file-to-all" class="input-file" />
        </div>
        <!-- send file to all: end -->

        &nbsp;

        <!-- share screen: begin -->
        <button id="share-screen" class="btn btn-sm btn-info btn-w-2">
        <i class="fas fa-desktop fs-large" style="color: white" data-tooltip="tooltip" title="Share your screen, application or browser tab"></i>
        </button>
        <!-- share screen: end -->

    </div>
    <!-- toolbar: end -->

  </div>
  <!-- external frame: end -->

  <div class="pt-2 row">
    <div lass="col-sm">
       <span class="hide-on-narrow-devices">
           &nbsp;&nbsp;&nbsp;&nbsp;<span id="company"></span> &ndash; <span id="license-compact"></span>
       </span>
    </div>
    <div class="col-sm text-end">
      <img class="pb-1" style="width: 1em" src="images/train.svg" >
      <span id="appname"></span>
    </div>
  </div>

</div>
<!-- Main panel: end -->


<!-- Message panel:begin -->
<div id="log-panel"
     class="opacity-90 container border rounded mt-2 mb-2 p-2 alert-warning alert alert-dismissible fade show app-width" role="alert">

    <span id="log-text">Ready to start&hellip;</span>
</div>
<!-- Message panel:end -->


<!-- Logon dialog: begin -->
<div class="modal fade" id="login-dialog" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">intrain: join a training session as speaker</h5>
      </div>
      <div class="modal-body">

        <form id="login-form">
          <label for="username" class="col-form-label">Call the supervisor:</label>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-phone-alt"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Enter a username">
          </div>
          <small id="usernameHelp" class="form-text text-muted small fw-light">Insert the username of the supervisor of the training session and then click the <em>call</em> button.</small>
        </form>

        <div id="login-status"></div>

        <hr/>

        <div class="form-check  float-end">
          <input type="checkbox" class="form-check-input debug-checkbox"
                 id="debugging2" name="debugging2"
                 data-bs-toggle='collapse' data-bs-target='.download-log-link-container'>
          <label class="form-check-label" for="debugging2">Collect logs for developers</label>
          <div class="w-100 collapse download-log-link-container" id="debugging-options-2">
            <a href="#" id="download-log-2" class="download-log-link">download logs</a>
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-warning me-auto" id="home-button">Exit</button>
        <button type="button" class="w-7em btn btn-secondary" id="cancel-button" disabled="true">Cancel</button>
        <button type="button" class="w-7em btn btn-success" id="join-button" >Call</button>
      </div>
    </div>
  </div>
</div>
<!-- Logon dialog: end -->


<!-- Config dialog: begin -->
<!-- Modal -->
<div class="modal fade" id="config-panel" tabindex="-1" role="dialog" aria-labelledby="config-panelTitle" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLongTitle">Configuration</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

    <form class="form">

      <div class="form-group">
        <label for="select-video-source">Select camera:</label>
        <div class="input-group">
          <div class="input-group-text"><i class="fas fa-video"></i></div>
          <select class="form-control" id="select-video-source"></select>
        </div>
      </div>


      <div class="form-group">
        <label for="select-audio-source">Select microphone:</label>
        <div class="input-group">
          <div class="input-group-text"><i style="width:1em" class="fas fa-microphone"></i></div>
          <select class="form-control" id="select-audio-source"></select>
        </div>
      </div>


      <div class="form-group">
        <label for="select-audio-output">Select audio output:</label>
        <div class="input-group">
          <div class="input-group-text"><i style="width:1em"   class="fas fa-headphones-alt"></i></div>
          <select class="form-control" id="select-audio-output"></select>
        </div>
      </div>

      <hr/>

      <div class="form-group">
        <div class="form-check ">
          <input type="checkbox" class="form-check-input debug-checkbox" id="debugging"
          data-bs-toggle='collapse' data-bs-target='.download-log-link-container' >
          <label class="form-check-label" for="debugging">Collect logs for developers</label>
          <div class="w-100 collapse download-log-link-container" id="debugging-options">
            <a href="#" id="download-log" class="download-log-link">download logs</a>
          </div>
        </div>
      </div>


    </form>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<!-- Config dialog: end -->


</body>
</html>
