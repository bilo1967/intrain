name: InTrain 1.0 smoke tests

on:
  push:
    branches:
      - '1.0'
  pull_request:
    branches:
      - '1.0'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application JavaScript syntax
        shell: bash
        run: |
          for script in js/*.js; do
            case "$script" in
              *.min.js) continue ;;
            esac
            node --check "$script"
          done
      - name: Existing regression tests
        run: node --test --test-name-pattern='^(?!supervisor starts only|supervisor reconnect targets|lag samples never|interpreter only seeks).*' tests/smoke.test.js
      - name: Sync ready regression
        if: always()
        run: node --test --test-name-pattern='^supervisor starts only' tests/smoke.test.js
      - name: Sync reconnect regression
        if: always()
        run: node --test --test-name-pattern='^supervisor reconnect targets' tests/smoke.test.js
      - name: Sync lag regression
        if: always()
        run: node --test --test-name-pattern='^lag samples never' tests/smoke.test.js
      - name: Sync interpreter regression
        if: always()
        run: node --test --test-name-pattern='^interpreter only seeks' tests/smoke.test.js
      - name: Run regression tests
        if: always()
        run: node --test tests/smoke.test.js
